version: 2.1

commands:
  install-clojure:
    description: "Install Clojure CLI tools"
    steps:
      - run:
          name: Install Clojure CLI 1.12.0.1488
          command: |
            if ! command -v clojure &> /dev/null; then
              curl -L -O https://download.clojure.org/install/linux-install-1.12.0.1488.sh
              chmod +x linux-install-1.12.0.1488.sh
              sudo ./linux-install-1.12.0.1488.sh
              rm linux-install-1.12.0.1488.sh
            fi

executors:
  clojure-java24:
    docker:
      - image: cimg/openjdk:24.0
    working_directory: ~/repo
    resource_class: large
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx3200m"

  cuda-compiler:
    docker:
      - image: nvidia/cuda:12.8.2-devel-ubuntu24.04
    working_directory: ~/repo
    resource_class: large

  hip-compiler:
    docker:
      - image: rocm/dev-ubuntu-24.04:6.4.3
    working_directory: ~/repo
    resource_class: large

jobs:
  setup:
    executor: clojure-java24
    steps:
      - checkout
      - install-clojure
      - run:
          name: Install OpenBLAS
          command: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "deps.edn" }}
            - v2-dependencies-
      - run:
          name: Download dependencies
          command: clojure -P -M:dev:test:build
      - save_cache:
          paths:
            - ~/.m2
            - ~/.gitlibs
          key: v2-dependencies-{{ checksum "deps.edn" }}
      - persist_to_workspace:
          root: ~/
          paths:
            - repo

  build:
    executor: clojure-java24
    steps:
      - attach_workspace:
          at: ~/
      - install-clojure
      - run:
          name: Build JAR
          command: clojure -T:build jar
      - persist_to_workspace:
          root: ~/
          paths:
            - repo/target

  test:
    executor: clojure-java24
    parallelism: 4
    steps:
      - attach_workspace:
          at: ~/
      - install-clojure
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "deps.edn" }}
            - v2-dependencies-
      - run:
          name: Install OpenBLAS + clang
          command: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev clang
      - run:
          name: Run deterministic test shard
          command: scripts/ci-test-shard.sh
      - store_artifacts:
          path: test-results
          destination: test-timings

  emit-gpu-compile-fixtures:
    executor: clojure-java24
    steps:
      - attach_workspace:
          at: ~/
      - install-clojure
      - run:
          name: Emit scheduled KernelBody CUDA and HIP sources
          command: >-
            clojure -M:gpu-compile-fixtures
            -m raster.compiler.backend.gpu.kernel-body-compile-fixtures
            gpu-compile-gates
      - persist_to_workspace:
          root: ~/
          paths:
            - repo/gpu-compile-gates

  cuda-compile-gate:
    executor: cuda-compiler
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Require the CUDA compiler
          command: nvcc --version
      - run:
          name: Compile scheduled kernels to PTX without a GPU
          command: |
            for source in gpu-compile-gates/cuda/*.cu; do
              nvcc -ptx -arch=sm_80 -o "${source}.ptx" "${source}"
            done

  hip-compile-gate:
    executor: hip-compiler
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Require the HIP compiler
          command: hipcc --version
      - run:
          name: Compile scheduled kernels to RDNA3 code objects without a GPU
          command: |
            for source in gpu-compile-gates/hip/*.hip; do
              hipcc --offload-arch=gfx1100 --genco -o "${source}.hsaco" "${source}"
            done

  opencl-cpu-gate:
    # Executes the OpenCL-gated namespaces on a CPU OpenCL implementation so emitted kernels are
    # compiled by a real OpenCL compiler and run without a GPU. Default: the distribution's PoCL
    # (OpenCL 1.2 on this image, so sub-group and fp16 kernels skip on their capability gates and
    # the log names the device that ran). Intel's CPU runtime (OpenCL 3.0 with sub-groups) is
    # opt-in via RASTER_CI_OPENCL_RUNTIME=intel: its JIT segfaults inside this container image
    # as of 2026-09, while it runs the full gated set locally in ~80 s.
    executor: clojure-java24
    steps:
      - attach_workspace:
          at: ~/
      - install-clojure
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "deps.edn" }}
            - v2-dependencies-
      - run:
          name: Install OpenBLAS, clang and a CPU OpenCL runtime
          command: |
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg libopenblas-dev liblapacke-dev \
              clang ocl-icd-libopencl1 clinfo
            if [ "${RASTER_CI_OPENCL_RUNTIME:-pocl}" = "intel" ]; then
              sudo update-ca-certificates
              curl -fsSL https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
                | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
              echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
                | sudo tee /etc/apt/sources.list.d/oneAPI.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y intel-oneapi-runtime-opencl
            else
              sudo apt-get install -y pocl-opencl-icd
            fi
            clinfo -l
      - run:
          name: Run OpenCL-gated tests on the CPU OpenCL device
          command: scripts/ci-opencl-cpu.sh
      - store_artifacts:
          path: test-results
          destination: test-timings

  deploy:
    executor: clojure-java24
    steps:
      - attach_workspace:
          at: ~/
      - install-clojure
      - run:
          name: Deploy to Clojars
          command: |
            if [ "${CIRCLE_BRANCH}" = "main" ]; then
              clojure -T:build deploy
            else
              echo "Skipping deploy - not on main branch"
            fi

  release:
    executor: clojure-java24
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh -y
      - run:
          name: Create GitHub release
          command: |
            if [ "${CIRCLE_BRANCH}" = "main" ] && [ -n "${GITHUB_TOKEN}" ]; then
              JAR_FILE=$(ls target/raster-*.jar | head -1)
              VERSION=$(basename "$JAR_FILE" | sed 's/raster-//' | sed 's/.jar//')

              echo "Creating release for version ${VERSION}"
              gh release create "v${VERSION}" \
                --target "${CIRCLE_SHA1}" \
                --title "Release ${VERSION}" \
                --notes "Raster ${VERSION}" \
                "$JAR_FILE" || echo "Release may already exist"
            else
              echo "Skipping release - not on main branch or no GITHUB_TOKEN"
            fi

workflows:
  version: 2
  build-test-and-deploy:
    jobs:
      - setup
      - build:
          requires:
            - setup
      - test:
          requires:
            - build
      - emit-gpu-compile-fixtures:
          requires:
            - build
      - opencl-cpu-gate:
          requires:
            - build
      - cuda-compile-gate:
          requires:
            - emit-gpu-compile-fixtures
      - hip-compile-gate:
          requires:
            - emit-gpu-compile-fixtures
      - deploy:
          context:
            - clojars-deploy
          filters:
            branches:
              only: main
          requires:
            - test
            - cuda-compile-gate
            - hip-compile-gate
      - release:
          context:
            - github-token
          filters:
            branches:
              only: main
          requires:
            - deploy
